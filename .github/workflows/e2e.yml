name: E2E Tests

run-name: E2E ${{ inputs.environment }} ${{ inputs.app_version }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment under test
        required: true
        type: string

      base_url:
        description: Application URL
        required: true
        type: string

      app_version:
        description: Expected application Git SHA
        required: true
        type: string

      test_grep:
        description: Playwright tag expression
        required: true
        type: string

      test_grep_invert:
        description: Tags that must not run
        required: false
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          BASE_URL: ${{ inputs.base_url }}
          APP_VERSION: ${{ inputs.app_version }}
          TEST_GREP: ${{ inputs.test_grep }}
          TEST_GREP_INVERT: ${{ inputs.test_grep_invert }}
        run: |
          ARGS=(
            --grep "$TEST_GREP"
            --shard="${{ matrix.shard }}/4"
          )

          if [ -n "$TEST_GREP_INVERT" ]; then
            ARGS+=(--grep-invert "$TEST_GREP_INVERT")
          fi

          npx playwright test "${ARGS[@]}"
